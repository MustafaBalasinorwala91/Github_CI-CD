name: Deploying the nodejs application to ec2 instance as runner in aws ap-south-1

on:
  workflow_run:
    workflows: ["Build the CI job for nodejs application"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy Node App to EC2
    runs-on: self-hosted

    steps:
      - name: Download artifacts from CI
        uses: actions/download-artifact@v4
        with:
          name: nodejs-app-artifacts
          path: ./artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show downloaded files
        run: ls -R

      - name: Create app directory
        run: sudo mkdir -p /var/www/nodeapp

      - name: Stop old app if running
        run: pm2 delete nodeapp || true

      - name: Copy new build
        run: |
          rm -rf /var/www/nodeapp/*
          cp -r artifact/* /var/www/nodeapp/

      - name: Start application using PM2
        run: |
          cd /var/www/nodeapp
          pm2 delete nodeapp || true

          if [ -d "dist" ]; then
            pm2 start "serve -s dist -l 3000" --name nodeapp
          fi

          if [ -d "build" ]; then
            pm2 start "serve -s build -l 3000" --name nodeapp
          fi

          pm2 save

      - name: Deployment completed
        run: echo "Application deployed successfully 🚀"