name: Build the CI job for nodejs application

on:
  push:
    branches:
      - ci-cd-branch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: QA

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test || echo "No tests"

      - name: Build React app
        run: npm run build

      # VERIFY BUILD EXISTS (IMPORTANT DEBUG STEP)
      - name: Show build files
        run: |
          echo "Listing dist folder"
          ls -R dist || true
          echo "Listing build folder"
          ls -R build || true

      - name: Prepare artifact
        run: |
          mkdir deploy-package
          if [ -d "dist" ]; then cp -r dist deploy-package/; fi
          if [ -d "build" ]; then cp -r build deploy-package/; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-app-artifacts
          path: deploy-package