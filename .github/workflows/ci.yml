name: Build the CI job for nodejs application

on:
  push:
    branches:
      - ci-cd-branch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: QA

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install NodeJS
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run tests (optional)
      - name: Run tests
        run: npm test || echo "No tests configured"

      # Build application (if build script exists)
      - name: Build application
        run: npm run build || echo "No build step"

      # Remove dev dependencies to reduce artifact size
      - name: Prune dev dependencies
        run: npm prune --production

      # Create deployment package
      - name: Prepare deployment folder
        run: |
          mkdir deploy-package
          cp -r src deploy-package/ 2>/dev/null || true
          cp -r dist deploy-package/ 2>/dev/null || true
          cp package.json deploy-package/
          cp package-lock.json deploy-package/ 2>/dev/null || true

      # Upload artifact for CD
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-app-artifacts
          path: deploy-package